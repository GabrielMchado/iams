spring:
  application:
    name: iams
  datasource:
    url: jdbc:mysql://localhost:3306/iams?allowPublicKeyRetrieval=true&useSSL=false
    username: iams
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer